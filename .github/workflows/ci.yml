name: Node.js CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - uses: mansona/npm-lockfile-version@v1
    - run: npm ci
    - run: npm run lint
    - run: npm test
